# 单容器编排：后端 API + 两个持久化卷。
#
# 用法：
#     docker compose up -d          # 首次会下载约 600MB 模型
#     docker compose logs -f api
#     docker compose down
#
# 卷的用意：
#   insightface-models —— 模型缓存。删容器不丢，重建容器不用重下 600MB。
#   app-data           —— SQLite / Milvus-Lite / 上传原图。这两个都是**单文件形态**，
#                        不挂卷的话容器一删数据就跟着没了。
#
# ⚠️ 本文件编写环境未安装 Docker，**尚未实机验证**。首次运行请先确认端口 8000 空闲。
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: face-attendance-api:latest
    container_name: face-attendance-api
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/backend
    volumes:
      - insightface-models:/root/.insightface
      - app-data:/app/backend/data
      - ./backend/uploads:/app/backend/uploads
    restart: unless-stopped

volumes:
  insightface-models:
  app-data:
